name: Build Flutter APK

on:
  push:
    branches: [ "main" ] # يشتغل لما ترفع كود على فرع main
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # يسمح لك تشغله يدوياً من زر Actions

jobs:
  build:
    runs-on: ubuntu-latest # بيئة لينكس أسرع بكثير من ماك لبناء الأندرويد

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تجهيز بيئة جافا (مطلوبة لـ Android)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. تجهيز بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # تفعيل الكاش الخاص بـ Flutter لتسريع البناء

      # 4. تفعيل الكاش لملفات Gradle (أندرويد)
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. تنزيل الحزم والمكتبات
      - name: Install dependencies
        run: flutter pub get

      # 6. حل مشكلة تعليق التراخيص (Accept Android licenses)
      # هذا الأمر يوافق تلقائياً على جميع التراخيص
      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true

      # 7. بناء ملف APK
      # نستخدم --split-per-abi لتقليل حجم التطبيق، أو يمكنك حذفها لبناء APK واحد شامل
      - name: Build APK
        run: flutter build apk --release

      # 8. رفع ملف الـ APK للتحميل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
